# testnet.yaml
#
# K8s manifest for validator, full, and archive nodes.
#
# Prerequisites:
#   - 1Password Operator installed and connected
#   - OnePasswordItem CRDs applied (see onepassword-items.yaml)
#   - ConfigMaps created from configs/ directory
#   - Docker image pushed to ECR

---
# ============================================================
# ConfigMaps (generated by scripts/generate-node-configs.sh)
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: validator-config
  namespace: tada
data:
  genesis.json: |
    # contents of configs/validator/genesis.json
  config.toml: |
    # contents of configs/validator/config.toml
  app.toml: |
    # contents of configs/validator/app.toml

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: full-config
  namespace: tada
data:
  genesis.json: |
    # contents of configs/full/genesis.json
  config.toml: |
    # contents of configs/full/config.toml
  app.toml: |
    # contents of configs/full/app.toml

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: archive-config
  namespace: tada
data:
  genesis.json: |
    # contents of configs/archive/genesis.json
  config.toml: |
    # contents of configs/archive/config.toml
  app.toml: |
    # contents of configs/archive/app.toml

---
# ============================================================
# 1Password → K8s Secret 동기화
# (1Password Operator가 자동으로 Secret 생성)
# ============================================================
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: validator-mnemonic
  namespace: tada
spec:
  itemPath: "vaults/testnet/items/validator-mnemonic"

---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: validator-node-key
  namespace: tada
spec:
  itemPath: "vaults/testnet/items/validator-node-key-json"

---
# ============================================================
# Services (headless — required by StatefulSet)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: validator-p2p-svc
  namespace: tada
spec:
  selector:
    app: validator
  ports:
    - name: p2p
      port: 26656
      targetPort: 26656
  clusterIP: None  # headless for stable DNS

---
apiVersion: v1
kind: Service
metadata:
  name: full-svc
  namespace: tada
spec:
  selector:
    app: full
  ports:
    - name: p2p
      port: 26656
      targetPort: 26656
    - name: rpc
      port: 26657
      targetPort: 26657
    - name: json-rpc
      port: 8545
      targetPort: 8545
  clusterIP: None

---
apiVersion: v1
kind: Service
metadata:
  name: archive-svc
  namespace: tada
spec:
  selector:
    app: archive
  ports:
    - name: p2p
      port: 26656
      targetPort: 26656
    - name: rpc
      port: 26657
      targetPort: 26657
  clusterIP: None

---
# ============================================================
# VALIDATOR StatefulSet
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: validator
  namespace: tada
spec:
  serviceName: validator-p2p-svc
  replicas: 1
  selector:
    matchLabels:
      app: validator
  template:
    metadata:
      labels:
        app: validator
    spec:
      containers:
        - name: validator
          image: <ECR_ACCOUNT>.dkr.ecr.<REGION>.amazonaws.com/tada:<IMAGE_TAG>
          # entrypoint.sh is called automatically (set in Dockerfile)

          env:
            # node config
            - name: NODE_TYPE
              value: "validator"
            - name: MONIKER
              value: "private-testnet-node1"
            - name: CHAIN_ID
              value: "tada_31451-1"
            - name: TADAD_HOME
              value: "/data/tadad"

            # validator mnemonic → priv_validator_key.json 생성에 사용
            - name: VALIDATOR_MNEMONIC
              valueFrom:
                secretKeyRef:
                  name: validator-mnemonic  # 1Password Operator가 생성한 Secret
                  key: mnemonic

          volumeMounts:
            # ConfigMap: genesis.json, config.toml, app.toml
            - name: validator-config
              mountPath: /configs/validator

            # Secret: node_key.json (파일로 마운트)
            - name: validator-node-key
              mountPath: /secrets
              readOnly: true

            # PersistentVolume: tadad home 데이터
            - name: data
              mountPath: /data

          ports:
            - containerPort: 26656  # P2P
            - containerPort: 26657  # RPC
            - containerPort: 9090   # gRPC
            - containerPort: 26660  # Prometheus

      volumes:
        - name: validator-config
          configMap:
            name: validator-config
        - name: validator-node-key
          secret:
            secretName: validator-node-key  # 1Password Operator가 생성한 Secret
            items:
              - key: node_key.json
                path: node_key.json         # → /secrets/node_key.json

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi

---
# ============================================================
# FULL NODE StatefulSet
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: full
  namespace: tada
spec:
  serviceName: full-svc
  replicas: 1
  selector:
    matchLabels:
      app: full
  template:
    metadata:
      labels:
        app: full
    spec:
      containers:
        - name: full
          image: <ECR_ACCOUNT>.dkr.ecr.<REGION>.amazonaws.com/tada:<IMAGE_TAG>

          env:
            - name: NODE_TYPE
              value: "full"
            - name: MONIKER
              value: "private-testnet-full"
            - name: CHAIN_ID
              value: "tada_31451-1"
            - name: TADAD_HOME
              value: "/data/tadad"

          volumeMounts:
            - name: full-config
              mountPath: /configs/full
            - name: data
              mountPath: /data

          ports:
            - containerPort: 26656
            - containerPort: 26657
            - containerPort: 8545   # EVM JSON-RPC

      volumes:
        - name: full-config
          configMap:
            name: full-config

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi

---
# ============================================================
# ARCHIVE NODE StatefulSet
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: archive
  namespace: tada
spec:
  serviceName: archive-svc
  replicas: 1
  selector:
    matchLabels:
      app: archive
  template:
    metadata:
      labels:
        app: archive
    spec:
      containers:
        - name: archive
          image: <ECR_ACCOUNT>.dkr.ecr.<REGION>.amazonaws.com/tada:<IMAGE_TAG>

          env:
            - name: NODE_TYPE
              value: "archive"
            - name: MONIKER
              value: "private-testnet-archive"
            - name: CHAIN_ID
              value: "tada_31451-1"
            - name: TADAD_HOME
              value: "/data/tadad"

          volumeMounts:
            - name: archive-config
              mountPath: /configs/archive
            - name: data
              mountPath: /data

          ports:
            - containerPort: 26656
            - containerPort: 26657

      volumes:
        - name: archive-config
          configMap:
            name: archive-config

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 500Gi  # archive는 모든 히스토리 보관
