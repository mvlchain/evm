services:
  evmd-node1:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    volumes:
      - .:/app
      - ./bin/evmd:/usr/local/bin/evmd:ro
      - ./.multinode:/data
    working_dir: /app
    environment:
      HOME: /data/node1
      FORCE_INIT: ${FORCE_INIT:-0}
    ports:
      - "26657:26657"
      - "1317:1317"
      - "9090:9090"
      - "8545:8545"
      - "8546:8546"
    command: ["bash", "-lc", "./scripts/multinode-entrypoint.sh node1"]

  evmd-node2:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    depends_on:
      - evmd-node1
