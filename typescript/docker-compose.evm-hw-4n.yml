      ]
    ports:
      - "28555:8545"
      - "28667:26657"
    volumes:
      - ../.bench-testnets:/data
    networks:
      evm-hw-net:
        ipv4_address: 192.168.20.3

  evm-node2:
    container_name: evmevm2
    image: ${EVMD_GOSSIP_IMAGE:-evmd-gossip:local}
    command:
      [
        "/bin/sh",
        "-lc",
        "set -e; exec evmd start --home /data/node2/evmd --chain-id hwbench-evm-1 --rpc.laddr=tcp://0.0.0.0:26657 --grpc.enable=false --api.enable=false --json-rpc.enable=true --json-rpc.address=0.0.0.0:8545 --json-rpc.ws-address=0.0.0.0:8546 --minimum-gas-prices=0atest --evm.mempool.account-slots=4096 --evm.mempool.account-queue=4096 --evm.mempool.global-slots=16384 --evm.mempool.global-queue=32768",
      ]
    ports:
