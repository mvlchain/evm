services:
  evmd-a:
    image: ${EVMD_GOSSIP_IMAGE:-evmd-gossip:local}
    build:
      context: ..
      dockerfile: typescript/Dockerfile.evmd-local
    environment:
      MATCHBOARD_TOKEN_MAP: token-alice=alice,token-bob=bob
      MATCHBOARD_GOSSIP_SHARED_SECRET: dev-gossip-secret
      MATCHBOARD_GOSSIP_NODE_ID: node-a
    command:
      [
        "/bin/sh",
        "-lc",
        "set -e; HOME_DIR=/tmp/evmd-home; if [ ! -f \"$$HOME_DIR/config/genesis.json\" ]; then evmd init node-a --chain-id gossip-1 --home \"$$HOME_DIR\" >/dev/null; fi; exec evmd start --home \"$$HOME_DIR\" --grpc-only --grpc.enable=true --grpc.address=0.0.0.0:9090 --grpc-web.enable=false --json-rpc.enable=false --api.enable=false --p2p.persistent_peers=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb@evmd-b:26656 --matchboard.enable=true --matchboard.address=0.0.0.0:8080",
      ]
    ports:
      - "28080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  evmd-b:
    image: ${EVMD_GOSSIP_IMAGE:-evmd-gossip:local}
    environment:
      MATCHBOARD_TOKEN_MAP: token-alice=alice,token-bob=bob
      MATCHBOARD_GOSSIP_SHARED_SECRET: dev-gossip-secret
      MATCHBOARD_GOSSIP_NODE_ID: node-b
    command:
      [
        "/bin/sh",
        "-lc",
        "set -e; HOME_DIR=/tmp/evmd-home; if [ ! -f \"$$HOME_DIR/config/genesis.json\" ]; then evmd init node-b --chain-id gossip-1 --home \"$$HOME_DIR\" >/dev/null; fi; exec evmd start --home \"$$HOME_DIR\" --grpc-only --grpc.enable=true --grpc.address=0.0.0.0:9090 --grpc-web.enable=false --json-rpc.enable=false --api.enable=false --p2p.persistent_peers=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa@evmd-a:26656 --matchboard.enable=true --matchboard.address=0.0.0.0:8080",
      ]
    ports:
      - "28081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
